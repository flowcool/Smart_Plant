version: 2
updates:
  - package-ecosystem: pip
    directory: /docs
    target-branch: V2R1
    schedule:
      interval: weekly
    groups:
      documentation:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /examples/multi-device/label_maker
    target-branch: V2R1
    schedule:
      interval: weekly
    groups:
      label-tooling:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    groups:
      security-tooling:
        patterns: ["*"]
