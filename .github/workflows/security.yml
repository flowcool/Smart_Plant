name: Security

on:
  pull_request:
  push:
    branches: [V2R1]
  schedule:
    - cron: "23 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Cairo build prerequisites
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcairo2-dev pkg-config
      - run: python -m pip install -r .github/requirements-security.txt
      - run: pip-audit -r docs/requirements.txt --progress-spinner off
      - run: pip-audit -r examples/multi-device/label_maker/requirements.txt --progress-spinner off
      - run: pip-audit -r .github/requirements-security.txt --progress-spinner off
