# Repository identity registry for the eight deployed Smart Plant devices.
# Live ESPHome YAML files remain authoritative for credentials and runtime config.
#
# Naming convention: device_name is the botanical slug (genre-espece). All eight
# devices set an explicit configured_name = <device_name>-<mac6> with
# name_add_mac_suffix: false (identity-preserving, naming-architecture.md §3.1):
# it freezes the already-effective node name, so hostname and MQTT topic prefix
# stay byte-for-byte while no MAC suffix leaks into the human device name. The two
# Ceropegia woodii (duplicate species) additionally rely on this to avoid a Device
# Builder collision on identical node names.
#
# mqtt_topic_prefix is the effective <device_name>-<mac6> value (= configured_name).
# It is listed here for reference, not manually managed. Two Ceropegias migrated
# from legacy sequential suffixes (woodii1/woodii2) to MAC-based prefixes.

# Presentation fields (see NAMING.md):
# display_name: full human name for HA device metadata and special screen pages.
# screen_title: optional normal-page title; defaults to display_name. The generator
# validates one line, <=18 Unicode characters and <=192 pixels in Audiowide 20.
# botanical_name / horticultural_name: descriptive source for secondary_name,
# rendered below screen_title. The botanical value takes precedence if present.
# room: inventory context only; it is not appended automatically to any name.
# label_image: background artwork; normal-page text is drawn separately by core.
# Inventory keys select generated package filenames; do not rename them casually.
# Edit this inventory, then run scripts/generate_device_metadata.py. Do not edit
# packages/generated/ directly or override their naming fields in live YAML.
plants:
  ceropegia-woodii-54a8f2:
    device_name: "ceropegia-woodii"
    configured_name: "ceropegia-woodii-54a8f2"
    name_add_mac_suffix: false
