# Offline replacement candidate. See README.md before integration.
# All display inputs live here. No generated background or fleet data is read.
substitutions:
  plant_illustration: "../multi-device/label_maker/illustrations/Pilea_peperomioides.png"
  screen_title: "Example plant"
  secondary_name: "Synthetic inputs"
  low_batt_warn_pct: "30"
  light_max: "3775"
  temp_min: "-10"
  temp_max: "50"
  hum_min: "20"
  hum_max: "80"
  # Recommendations affect only the artwork. Align HA Plant manually.
  soil_recommended_min: "20"
  soil_recommended_max: "60"
  light_recommended_min: "500"
  light_recommended_max: "2500"
  temp_recommended_min: "15"
  temp_recommended_max: "30"
  hum_recommended_min: "30"
  hum_recommended_max: "70"

esphome:
  includes: [page.h]

image:
  - platform: file
    file: "${plant_illustration}"
    id: plant_art
    type: BINARY
    resize: [75, 88]
    invert_alpha: true

font:
  - file: "../multi-device/label_maker/fonts/Audiowide-Regular.ttf"
    id: font_title
    size: 20
    glyphsets: [GF_Latin_Core]
  - file: "../multi-device/label_maker/fonts/Audiowide-Regular.ttf"
    id: font_subtitle
    size: 15
    glyphsets: [GF_Latin_Core]
  - file: "../multi-device/label_maker/fonts/Audiowide-Regular.ttf"
    id: font_parameters
    size: 15
  - file: "gfonts://Material+Symbols+Outlined"
    id: font_icon
    size: 20
    glyphs: ["\U0000ebdc", "\U0000ebd9", "\U0000ebe0", "\U0000ebdd", "\U0000ebe2", "\U0000ebd4", "\U0000e1a4", "\U0000e627"]
  - file: "gfonts://Material+Symbols+Outlined"
    id: font_gauge_icon
    size: 22
    # water_drop, sunny, device_thermostat, humidity_percentage.
    glyphs: ["\U0000e798", "\U0000e81a", "\U0000e1ff", "\U0000f87e"]

display:
  - id: my_display
    pages:
      - id: page1
        lambda: |-
          using namespace smart_plant_page;
          const Reading battery{id(batpercent).state, id(batpercent).has_state()};
          const bool warning = battery.valid() && battery.value < ${low_batt_warn_pct};
          const auto fg = warning ? COLOR_OFF : COLOR_ON;
          const auto bg = warning ? COLOR_ON : COLOR_OFF;
          it.fill(bg);
          it.image(5, 37, id(plant_art), fg, bg);
          // Preserve placement and text. Check fit before integrating this page.
          it.print(2, 0, id(font_title), fg, TextAlign::TOP_LEFT, "${screen_title}");
          it.print(2, 22, id(font_subtitle), fg, TextAlign::TOP_LEFT, "${secondary_name}");
          if (battery.valid()) {
            const float icon_percent = std::fmin(100.0f, std::fmax(0.0f, battery.value));
            const int index = static_cast<int>(icon_percent / 16.0f);
            const char *icons[] = {"\U0000ebdc", "\U0000ebd9", "\U0000ebe0", "\U0000ebdd", "\U0000ebe2", "\U0000ebd4", "\U0000e1a4"};
            it.print(278, 1, id(font_icon), fg, TextAlign::TOP_LEFT, icons[index]);
            it.printf(278, 1, id(font_subtitle), fg, TextAlign::TOP_RIGHT, "%3.0f%%", battery.value);
          } else {
            it.print(278, 1, id(font_subtitle), fg, TextAlign::TOP_RIGHT, " --%");
          }
          const auto now = id(esptime).now();
          if (now.is_valid()) {
            it.strftime(278, 18, id(font_subtitle), fg, TextAlign::TOP_RIGHT, "%H:%M %d/%m", now);
          } else {
            it.print(278, 18, id(font_subtitle), fg, TextAlign::TOP_RIGHT, "--:-- --/--");
          }
          it.print(278, 18, id(font_icon), fg, TextAlign::TOP_LEFT, "\U0000e627");
          // Each scale and band is consumed once by both ring and needle.
          const Gauge gauges[] = {
            {0, 100, ${soil_recommended_min}, ${soil_recommended_max}, 80, 50, "%.0f%%", "\U0000e798"},
            {0, ${light_max}, ${light_recommended_min}, ${light_recommended_max}, 134, 70, "%.0flx", "\U0000e81a"},
            {${temp_min}, ${temp_max}, ${temp_recommended_min}, ${temp_recommended_max}, 188, 50, "%.0f°C", "\U0000e1ff"},
            {${hum_min}, ${hum_max}, ${hum_recommended_min}, ${hum_recommended_max}, 242, 70, "%.0f%%", "\U0000f87e"}
          };
          const Reading readings[] = {
            {id(soil).state, id(soil).has_state()}, {id(light).state, id(light).has_state()},
            {id(temp).state, id(temp).has_state()}, {id(hum).state, id(hum).has_state()}
          };
          for (int i = 0; i < 4; ++i)
            gauge(it, gauges[i], readings[i], id(font_parameters), id(font_gauge_icon), fg, TextAlign::TOP_CENTER);
